                <p class="precio-mercado">
                    <strong id="precio-perfil"></strong>
                </p>

                <!-- JavaScript define si este botón es Contactar o Postular. -->
                <button
                    class="btn-contactar"
                    id="btn-accion"
                    type="button">
                    Contactar
                </button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; Scoutball 2026</p>
    </footer>

        /* Elige la base de datos correcta. */
        const baseDatosActiva =
            tipo === "equipo"
                ? baseDatosEquipos
                : baseDatosJugadores;

        const entidad = baseDatosActiva[id];

        /* Crea un recuadro con nombre y valor. */
        function mostrarCampo(numero, etiqueta, valor) {
            document.getElementById("campo-" + numero).innerHTML =
                '<span class="etiqueta-dato">' + etiqueta + "</span>" +
                '<strong class="valor-dato">' +
                (valor || "No informado") +
                "</strong>";
        }

        if (entidad) {
            document.getElementById("img-perfil").src = entidad.imagen;

            if (tipo === "equipo") {
                /* PERFIL DE EQUIPO */
                document.title = entidad.nombre + " | Scoutball";

                document.getElementById("img-perfil").alt =
                    "Escudo de " + entidad.nombre;

                document.getElementById("nombre-perfil").textContent =
                    entidad.nombre;

                mostrarCampo(1, "Estadio", entidad.estadio);
                mostrarCampo(2, "Fundación", entidad.fundacion);
                mostrarCampo(3, "Ciudad", entidad.ciudad);
                mostrarCampo(4, "Presidente", entidad.presidente);
                mostrarCampo(5, "Títulos", entidad.titulos);
                mostrarCampo(6, "Competencia internacional", entidad.champions);
                mostrarCampo(7, "Correo de reclutamiento", entidad.correo);
                mostrarCampo(8, "Número telefónico", entidad.numero_tlf);

                /* Los otros cuadros son de jugadores. */
                for (let i = 9; i <= 19; i++) {
                    document.getElementById("campo-" + i).style.display =
                        "none";
                }

                document.getElementById("precio-perfil").textContent =
                    entidad.precio;

                const botonEquipo =
                    document.getElementById("btn-accion");

                /* Un equipo no debe abrir el formulario de jugador. */
                botonEquipo.removeAttribute("data-contactar");

                botonEquipo.textContent = "Postular al equipo";

                // Asignamos los atributos para que el script externo (validaciones.js) detecte el clic y abra el modal con validaciones
                botonEquipo.setAttribute("data-postular", "");
                botonEquipo.dataset.nombre = entidad.nombre;
                botonEquipo.dataset.correo = entidad.correo;
                botonEquipo.dataset.telefono = entidad.numero_tlf;
            } else {
                /* PERFIL DE JUGADOR */
                const nombreCompleto = [
                    entidad.pnombre,
                    entidad.snombre,
                    entidad.appaterno,
                    entidad.apmaterno
                ].filter(Boolean).join(" ");

                document.title = nombreCompleto + " | Scoutball";

                document.getElementById("img-perfil").alt =
                    "Foto de " + nombreCompleto;

                document.getElementById("nombre-perfil").textContent =
                    nombreCompleto;

                const botonContacto =
                    document.getElementById("btn-accion");

                /* Solo un jugador usa data-contactar. */
                botonContacto.setAttribute("data-contactar", "");

                botonContacto.dataset.nombre = nombreCompleto;
                botonContacto.dataset.representante =
                    entidad.representante;
                botonContacto.dataset.correo = entidad.correo;
                botonContacto.dataset.telefono = entidad.numero_tlf;

                mostrarCampo(1, "Primer nombre", entidad.pnombre);
                mostrarCampo(2, "Segundo nombre", entidad.snombre);
                mostrarCampo(3, "Apellido paterno", entidad.appaterno);
                mostrarCampo(4, "Apellido materno", entidad.apmaterno);
                mostrarCampo(5, "Nacionalidad", entidad.nacionalidad);
                mostrarCampo(
                    6,
                    "Fecha de nacimiento",
                    entidad.fecha_nacimiento
                );
                mostrarCampo(7, "Correo", entidad.correo);
                mostrarCampo(8, "Número telefónico", entidad.numero_tlf);
                mostrarCampo(9, "Dirección", entidad.direccion);
                mostrarCampo(10, "Sobre mí", entidad.sobre_mi);
                mostrarCampo(11, "Posición", entidad.posicion);
                mostrarCampo(12, "Altura", entidad.altura);
                mostrarCampo(13, "Peso", entidad.peso);

                mostrarCampo(15, "Pierna hábil", entidad.pierna_habil);
                mostrarCampo(16, "Representante", entidad.representante);
                mostrarCampo(17, "Equipo actual", entidad.equipo);

                document.getElementById("campo-18").style.display =
                    "none";

                document.getElementById("campo-19").style.display =
                    "none";

                document.getElementById("precio-perfil").textContent =
                    entidad.precio;
