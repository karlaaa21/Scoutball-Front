<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoutball</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/validaciones.js" defer></script>
</head>
<body>
     <header class="CabeceraFondo">
        <a href="index.html">
        <img src="imagenes/Logo.png" alt="Logo de Scoutball" width="200" height="100">
        </a>
    </header>

    <nav class="Menu">
        <a href="index.html">Inicio</a>
        <a href="jugadores.html">Jugadores</a>
        <a href="equipos.html">Equipos</a>
        <a href="registro.html">Crear ficha</a>
        <a href="registroequipo.html">¡Arma tu once!</a>
        <a class="activo"  href="login.html">¡Entra a la Cancha!</a>
    </nav>


  <main class="contenedor">
    <section aria-labelledby="login-titulo">
      <h2 class="letrastit" id="login-titulo">Ingresar al sitio</h2>

      <form id="formLogin" novalidate>
        <div class="campo">
          <label for="loginEmail">Correo electrónico</label>
          <input id="loginEmail" name="loginEmail" type="email" placeholder="Ej: ana@mail.com" autocomplete="email" required />
          <small class="error" id="err-login-email" aria-live="polite"></small>
        </div>

        <div class="campo">
          <label for="loginPassword">Contraseña</label>
          <input id="loginPassword" name="loginPassword" type="password" required minlength="8" />
          <small class="error" id="err-login-password" aria-live="polite"></small>
        </div>

        <button class="btn" type="submit">Ingresar</button>
      </form>
    </section>
  </main>

  <footer>
    <div class="contenedor">
      <p>&copy; Scoutball 2026</p>
    </div>
  </footer>
</body>
</html>
